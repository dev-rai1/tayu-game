name: Tayu CI / Deploy

# Vercel (frontend) and Render (backend) both auto-deploy on push to main via
# their own GitHub integrations. This workflow runs install + tests as a gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present

  browser-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright runner and Chromium
        run: |
          npm install --no-save @playwright/test@1.47.2
          # No --with-deps: the GitHub ubuntu-latest runner already ships
          # Chromium's system libraries, and --with-deps runs apt against a
          # flaky mirror that was hanging the job for 30+ minutes. Just fetch
          # the browser binary.
          npx playwright install chromium
      - name: Start Vite and verify the real 3D town renders
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/tayu-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          READY=0
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:4173/3d-smoke.html >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/tayu-vite.log
            exit 1
          fi
          npx playwright test e2e/3d-smoke.spec.js --reporter=line

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test --if-present
