name: Tayu CI / Deploy

# Vercel (frontend) and Render (backend) both auto-deploy on push to main via
# their own GitHub integrations. This workflow runs install + tests as a gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required checks must also run on the temporary commits created by
  # GitHub's merge queue. Without this event, queued PRs remain blocked
  # because the frontend and backend checks are never reported.
  merge_group:
    types: [checks_requested]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present -- --reporter=json --outputFile=vitest-results.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-results
          path: frontend/vitest-results.json

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test --if-present
