name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Mark production deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'firebase/production',
              description: 'Building and verifying Firebase production',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - uses: actions/checkout@v4

      - name: Create deployment marker
        run: |
          mkdir -p frontend/public
          printf '{"commit":"%s","runId":"%s","deployedAt":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > frontend/public/deployment.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        run: |
          cd frontend
          npm ci
          npm run build
        # These browser values are optional on Firebase Hosting. When they are
        # absent, the app loads its public config from /__/firebase/init.json.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify Firebase deployment credential
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Add the FIREBASE_TOKEN repository secret before deploying."
            exit 1
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Hosting goes first so a Firestore configuration problem can never leave
      # a successfully built website unpublished. The workflow still fails if
      # rules do not deploy, so a partial release is visible and actionable.
      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting --non-interactive --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --non-interactive --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Verify exact production commit and SPA routes
        shell: bash
        run: |
          set -euo pipefail

          verify_host() {
            local host="$1"
            local marker=""
            echo "Verifying ${host}"
            for attempt in $(seq 1 18); do
              marker="$(curl --fail --location --silent --show-error \
                --connect-timeout 15 --max-time 30 \
                "${host}/deployment.json?sha=${GITHUB_SHA}&attempt=${attempt}" || true)"
              if printf '%s' "$marker" | grep -Fq "$GITHUB_SHA"; then
                for route in / /modules /teacher-guide; do
                  curl --fail --location --silent --show-error \
                    --connect-timeout 15 --max-time 30 \
                    "${host}${route}?deployment=${GITHUB_SHA}" \
                    | grep -Fq '<div id="root"></div>'
                done
                echo "Verified ${host} at ${GITHUB_SHA}"
                return 0
              fi
              sleep 10
            done
            echo "::error::${host} did not serve deployment ${GITHUB_SHA}. Last marker: ${marker}"
            return 1
          }

          verify_host "https://tayu-financial-literacy.web.app"
          verify_host "https://tayufinance.app"

      - name: Publish successful production deployment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'firebase/production',
              description: 'Hosting, Firestore rules, commit marker, and routes verified',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Publish failed production deployment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'firebase/production',
              description: 'Firebase production deployment or verification failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
