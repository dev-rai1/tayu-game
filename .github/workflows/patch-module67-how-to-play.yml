name: Patch Module 6-7 How to Play
on:
  push:
    branches: [fresh-module67-drag-review]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fresh-module67-drag-review
      - name: Update module help for Modules 6 and 7
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/components/ModuleGlossary.jsx')
          s = p.read_text()
          old = """const PLAY_STEPS = [
  ['Pick a module', 'Choose your recommended next module, replay a finished one, or explore another available module.'],
  ['Move around', 'Desktop: use WASD to move. Touch devices: use the on-screen MOVE pad.'],
  ['Interact', 'Desktop: press E when an interaction prompt appears. Touch devices: use the DO button. Some objects can also be tapped directly.'],
  ['Follow the in-world prompts', 'Make choices, read the feedback, and complete the short concept checks. Optional hints and read-aloud tools are there when you need them.'],
  ['Use the Module Menu', 'The menu button inside the 3D world brings you back here without making you log in again.'],
  ['Modules 6 and 7', 'Bond Street and the TAYU Tax Office are separate 3D destinations. You arrive near the building, walk to the interaction point, and press E or DO to begin.'],
]
"""
          new = """const PLAY_STEPS = [
  ['Pick a module', 'Choose your recommended next module, replay a finished one, or explore another available module.'],
  ['Move around the world', 'Desktop: use WASD to walk. Touch devices: use the on-screen MOVE pad. Follow the path toward the highlighted building or activity.'],
  ['Talk and interact', 'Desktop: press E when an interaction prompt appears. Touch devices: use the DO button. This starts conversations and activities in the 3D world.'],
  ['Do the activity — not just buttons', 'Different challenges use different controls. You may type a number, drag an answer card into the basket, move sliders to build a portfolio, sort items into categories, or make another hands-on choice.'],
  ['Watch what your decision does', 'After a decision, look at the 3D world. Modules 6 and 7 animate the result around the Bond Street or Tax Office scene before you continue.'],
  ['Module 6 · Bond Street', 'Walk to Bond Street and talk to Ben. Work through bond decisions using drag-and-drop, typed calculations, and the portfolio sliders. Drag cards all the way into the answer basket and release them there.'],
  ['Module 7 · TAYU Tax Office', 'Walk up the Tax Office path and talk to Rex. Complete the practice return using typed math, drag-and-drop decisions, and the taxable-versus-excluded sorting activity.'],
  ['Need to leave?', 'The Module Menu button inside the 3D world brings you back to the module menu without making you log in again.'],
]
"""
          if old not in s:
              raise SystemExit('PLAY_STEPS block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit help update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/ModuleGlossary.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix How to Play for Modules 6 and 7"
          git push origin HEAD:fresh-module67-drag-review