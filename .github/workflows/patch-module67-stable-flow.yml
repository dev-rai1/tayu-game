name: Patch stable Module 6-7 form flow
on:
  push:
    branches: [module67-stable-form-flow]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: module67-stable-form-flow
      - name: Route normal choices through the proven shared bottom sheet
        run: |
          python - <<'PY'
          from pathlib import Path

          hud = Path('frontend/src/world/Hud.jsx')
          s = hud.read_text()
          old = "if (!card || dialog || lateWeek === 6 || lateWeek === 7) return null"
          new = """const lateSpecial = /^(bond(?:2|3|9|10|11)|tax(?:1|2|4|5|6|8|10|11))$/.test(String(card?.id || ''))
  if (!card || dialog || lateSpecial) return null"""
          if old not in s:
              raise SystemExit('BottomSheet late-week guard not found')
          s = s.replace(old, new, 1)

          old_style = "${i === 0 ? 'bg-electric text-white hover:bg-teal hover:text-navy' : 'bg-navy/10 text-navy hover:bg-navy/20'}"
          new_style = "${lateWeek === 6 || lateWeek === 7 ? 'border-2 border-navy/15 bg-white text-navy hover:bg-navy/5 hover:border-navy/30' : i === 0 ? 'bg-electric text-white hover:bg-teal hover:text-navy' : 'bg-navy/10 text-navy hover:bg-navy/20'}"
          if old_style not in s:
              raise SystemExit('BottomSheet button style not found')
          s = s.replace(old_style, new_style, 1)
          hud.write_text(s)

          panel = Path('frontend/src/world/LateGameChallengePanel.jsx')
          p = panel.read_text()
          old = """if(!isLate||dialog||!card)return null
  if(/^(bondfb|taxfb)/.test(String(card.id)))return <Feedback card={card} act={cardAct}/>
  if(!step)return null"""
          new = """if(!isLate||dialog||!card)return null
  // Only the genuinely hands-on steps use this custom panel. All ordinary
  // choices and all feedback go through Hud's proven shared BottomSheet.
  const specialId=/^(bond(?:2|3|9|10|11)|tax(?:1|2|4|5|6|8|10|11))$/.test(String(card.id))
  if(!specialId)return null
  if(!step)return null"""
          if old not in p:
              raise SystemExit('LateGameChallengePanel guard not found')
          p = p.replace(old, new, 1)
          panel.write_text(p)
          PY
      - name: Commit stable interaction routing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/world/Hud.jsx frontend/src/world/LateGameChallengePanel.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Use stable shared buttons for Module 6 and 7 choices"
          git push origin HEAD:module67-stable-form-flow