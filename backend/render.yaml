# Render Blueprint (YAML is Render's real format; spec called it render.json).
services:
  - type: web
    name: tayu-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SOCKET_IO_CORS_ORIGIN
        sync: false
      - key: FIREBASE_ADMIN_KEY
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: SESSION_TIMEOUT_MINUTES
        value: "60"
      - key: MAX_PLAYERS_PER_SESSION
        value: "15"
